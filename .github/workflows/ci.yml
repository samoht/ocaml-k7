name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: ['5.4']
        include:
          - os: macos-latest
            ocaml-compiler: '5.4'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # The native recorder's fish test needs fish, which the Ubuntu
      # runners lack.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  lower-bounds:
    name: Lower bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      # Resolve every dependency to the oldest version its lower bound allows,
      # so a call that only compiles against a newer API fails here rather than
      # in a downstream opam build.
      - run: opam install . --deps-only --with-test --criteria="+count[version-lag,solution]"
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  lint-fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - uses: ocaml/setup-ocaml/lint-fmt@v3

  # merlint is not on opam yet and comes from a private overlay, so this job
  # reports without blocking until merlint is released.
  merlint:
    name: Lint (merlint)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam repo add samoht https://tangled.org/gazagnaire.org/opam-overlay.git
      - run: opam install . --deps-only --with-test
      - run: opam install merlint
      - run: opam exec -- merlint --build
