name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: ['5.4']
        include:
          - os: macos-latest
            ocaml-compiler: '5.4'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # The zsh and fish tests skip without them.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  lower-bounds:
    name: Lower bounds
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      # The oldest version each lower bound allows.
      - run: opam install . --deps-only --with-test --criteria="+count[version-lag,solution]"
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  doc:
    name: Documentation
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only --with-doc
      - run: opam exec -- dune build @doc

  lint-fmt:
    name: Format
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - uses: ocaml/setup-ocaml/lint-fmt@v3

  opam-build:
    name: Build as opam-repository does
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only
      - run: opam exec -- dune build -p k7 @install

  # merlint is not on opam-repository yet, only on an overlay.
  merlint:
    name: Lint (merlint)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam repo add samoht https://tangled.org/gazagnaire.org/opam-overlay.git
      - run: opam install . --deps-only --with-test
      # nox-git's tests need these to load even when only its library builds.
      - run: opam install nox-dune nox-csv
      - run: opam install merlint
      - run: opam exec -- merlint --build
