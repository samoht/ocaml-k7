handle: samoht
mono_url: https://github.com/samoht/ocaml-k7.git

storage:
  bucket: homebrew-bottles
  region: fr-par
  profile: homebrew-samoht

tap:
  clone_url: https://github.com/samoht/homebrew-tap.git
  push_url: git@github.com:samoht/homebrew-tap
  local_path: "../homebrew-tap"

build:
  linux: static
  switch: lto-5.4.1
  platforms: [arm64_sonoma, x86_64_linux, arm64_linux]
  compiler: [ocaml-variants.5.4.1, ocaml-option-flambda]
  compiler_url: git+https://github.com/samoht/ocaml.git#6ca6a458ac78
  lto: true

packages:
  - name: k7
    target: bin/main.exe
    description: "Record terminal programs, cram tests and VHS tapes as animated SVG"
    homepage: https://github.com/samoht/ocaml-k7
    requires: {}
    head_deps:
      - name: vhs
        type: recommended
